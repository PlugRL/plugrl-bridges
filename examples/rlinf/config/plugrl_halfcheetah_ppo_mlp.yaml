# RLinf's PPO with its MLP policy, on HalfCheetah-v5 run by PlugRL env clients.
#
# RLinf's own embodichain_ppo_cart_pole.yaml with the env swapped for
# env_type plugrl, one GPU, TensorBoard logging and no evaluation (an eval
# env would need clients of its own). 16 envs x 256 steps = 4,096 frames per
# epoch, E43's buffer size; 100 epochs is E43's 409,600 steps.
#
# Copy this file to RLinf's examples/embodiment/config/ and env/plugrl_halfcheetah.yaml
# to examples/embodiment/config/env/, then:
#   bash examples/embodiment/run_embodiment.sh plugrl_halfcheetah_ppo_mlp
defaults:
  - env/plugrl_halfcheetah@env.train
  - env/plugrl_halfcheetah@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "plugrl_halfcheetah_ppo_mlp"
    logger_backends: ["tensorboard"]

  max_epochs: 100
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 20

  seq_length: 1
  max_prompt_length: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 8
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1

  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0

  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 1.0
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 1.0

env:
  group_name: EnvGroup

  train:
    rollout_epoch: 1
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_steps_per_rollout_epoch: 256
    max_episode_steps: 1000
    reward_coef: ${algorithm.reward_coef}
    is_eval: False

  eval:
    rollout_epoch: 1
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_steps_per_rollout_epoch: 256
    max_episode_steps: 1000
    reward_coef: ${algorithm.reward_coef}
    is_eval: True

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1

  model:
    model_path: ""
    precision: ${actor.model.precision}

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 1024
  seed: 1234
  enable_offload: false

  model:
    model_type: mlp_policy
    model_path: ""
    obs_dim: 17
    action_dim: 6
    num_action_chunks: 1
    hidden_dim: 256
    precision: "32"
    add_value_head: true
    is_lora: false
    lora_rank: 32

  optim:
    lr: 3.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 0.5

  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false

    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

    amp_autocast:
      enabled: false
      precision: "bf16"

    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
