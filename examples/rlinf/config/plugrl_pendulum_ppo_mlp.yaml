# RLinf's PPO with its MLP policy, on Pendulum run by the C++ client of
# plugrl-server's E44 (pendulum_client.cpp, no third-party libraries).
#
# plugrl_halfcheetah_ppo_mlp.yaml with rl-baselines3-zoo's published PPO
# settings for Pendulum-v1, as E44 used them: gamma 0.9, gae_lambda 0.95,
# 10 epochs, lr 1e-3, clip 0.2, no entropy bonus, minibatch 64 (rl-zoo leaves
# batch_size at SB3's default). (E44's pilot found that defaults barely learn
# Pendulum.) 16 envs x 256 steps = 4,096 frames per epoch; 25 epochs is E44's
# 102,400 steps.
#
# Copy this file to RLinf's examples/embodiment/config/ and env/plugrl_pendulum.yaml
# to examples/embodiment/config/env/.
defaults:
  - env/plugrl_pendulum@env.train
  - env/plugrl_pendulum@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "plugrl_pendulum_ppo_mlp"
    logger_backends: ["tensorboard"]

  max_epochs: 25
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 20

  seq_length: 1
  max_prompt_length: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 10
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1

  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0

  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 1.0
  huber_delta: 10.0

  gamma: 0.9
  gae_lambda: 0.95

  reward_coef: 1.0

env:
  group_name: EnvGroup

  train:
    rollout_epoch: 1
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_steps_per_rollout_epoch: 256
    max_episode_steps: 200
    reward_coef: ${algorithm.reward_coef}
    is_eval: False

  eval:
    rollout_epoch: 1
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_steps_per_rollout_epoch: 256
    max_episode_steps: 200
    reward_coef: ${algorithm.reward_coef}
    is_eval: True

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1

  model:
    model_path: ""
    precision: ${actor.model.precision}

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # rl-zoo's Pendulum-v1 PPO leaves batch_size at SB3's default, 64: with
  # 10 epochs, 640 updates per 4,096-frame rollout. The 1,024 this config
  # first inherited from RLinf's CartPole template made 40 (E49's pilot).
  micro_batch_size: 64
  global_batch_size: 64
  seed: 1234
  enable_offload: false

  model:
    model_type: mlp_policy
    model_path: ""
    obs_dim: 3
    action_dim: 1
    num_action_chunks: 1
    hidden_dim: 256
    precision: "32"
    add_value_head: true
    is_lora: false
    lora_rank: 32

  optim:
    lr: 1.0e-3
    value_lr: 1.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 0.5

  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false

    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

    amp_autocast:
      enabled: false
      precision: "bf16"

    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
